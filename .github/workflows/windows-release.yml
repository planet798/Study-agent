name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (X.Y.Z); dispatch builds artifacts only'
        required: true
        default: '0.2.2'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r packaging/linux-test.txt
      - run: npm ci
        working-directory: oauth_bridge
      - run: npm test
        working-directory: oauth_bridge
      - run: python -m pytest -q --junitxml=regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: regression.xml

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $Version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { $env:INPUT_VERSION }
          if ($Version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "RELEASE_VERSION=$Version" >> $env:GITHUB_ENV
          "version=$Version" >> $env:GITHUB_OUTPUT
      - run: python -m pip install -r packaging/windows-build.txt -r packaging/windows-test.txt
      - run: python -m pip check
      - name: Windows data and startup regressions
        run: python -m pytest -q tests/test_bridge_pool.py tests/test_agent_stream_preview.py tests/test_agent_composer.py tests/test_agent_model_client.py tests/test_ai_settings_ui.py tests/test_app_update_service.py tests/test_app_update_ui.py tests/test_app_update_updater.py tests/test_app_update_startup.py tests/test_app_update_windows.py tests/test_runtime_paths.py tests/test_desktop_data_service.py tests/test_desktop_startup.py tests/test_desktop_entry.py tests/test_windows_launcher.py tests/test_pi_ai_bridge.py tests/test_main_cli.py tests/test_release_migration_hardening.py tests/test_migration_verifier_regression.py
      - name: Install compiler
        run: choco install innosetup --version=6.5.4 --yes --no-progress --allow-downgrade --force
      - name: Build installer
        run: ./scripts/build_windows.ps1 -Version $env:RELEASE_VERSION
      - name: Offline bridge benchmark
        run: python scripts/benchmark_bridge.py --output build/bridge-benchmark.json
      - name: Verify installation, frozen runtime, upgrade and uninstall
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify_windows_package.ps1 -Version $env:RELEASE_VERSION
      - name: Checksum
        shell: pwsh
        run: |
          $File = "dist/installer/StudyAgent-Setup-$env:RELEASE_VERSION-x64.exe"
          $Hash = (Get-FileHash $File -Algorithm SHA256).Hash.ToLower()
          "$Hash  $(Split-Path $File -Leaf)" | Set-Content -Encoding utf8NoBOM dist/installer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StudyAgent-Windows-${{ env.RELEASE_VERSION }}
          path: dist/installer/*

  publish-draft:
    needs: [regression, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StudyAgent-Windows-${{ needs.windows.outputs.version }}
          path: release-assets
      - name: Create draft release after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "release-assets/StudyAgent-Setup-$RELEASE_VERSION-x64.exe"
          release-assets/SHA256SUMS.txt --verify-tag --draft
          --title "Study Agent $RELEASE_VERSION"
          --notes-file docs/WINDOWS_RELEASE_NOTES.md

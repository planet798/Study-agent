[pytest]
testpaths = tests
# 无显示环境下跑 GUI 测试使用 offscreen 平台
qt_api = pyside6
# Routine broad development: pytest -m "not slow" -q
# Migration: pytest -m migration -q
# UI: pytest -m ui -q
# Thread lifecycle: pytest -m threaded -q
# Integration: pytest -m integration -q
# Full release gate: pytest -q (markers never skip tests by default)
markers =
    slow: Intentionally expensive real-DB upgrades, long simulations or costly worker/integration paths; excluded during routine iteration, not synonymous with ui/integration/migration
    migration: Real schema upgrades, legacy data migration, migration gates or release-verifier history contracts (not a test merely named legacy)
    ui: Requires Qt application/widgets/event loop, including qtbot or qapp-only tests and explicitly marked subprocess GUI tests
    integration: Composes multiple production services/subsystems to verify cross-component behavior
    threaded: Correctness depends on QThread/background worker lifecycle or thread-owned resources
